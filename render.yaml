# Render Blueprint — free web service, no credit card.
#
# Render can read this automatically ("New +" -> "Blueprint"), or you can create
# the service by hand and set the same variables in the dashboard.
#
# The browser is NOT in this container: it runs on Browserless and is reached
# over CDP. That is what keeps the app inside Render's 512 MB free tier.

services:
  - type: web
    name: report-automation
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile      # the THIN image — no Chromium
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # --- browser backend (required) -------------------------------------
      - key: BROWSER_BACKEND
        value: browserless
      - key: BROWSERLESS_WS          # wss://production-sfo.browserless.io?token=...
        sync: false                  # set in the dashboard; it contains a token
      - key: BROWSER_MAX_CONCURRENCY # Browserless free allows 2 browsers
        value: "2"

      # --- how work runs --------------------------------------------------
      # Render free has no always-on worker and sleeps when idle, so the
      # capture runs inside the request and streams progress back.
      - key: EXECUTION_MODE
        value: inline
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: CAPTURE_WORKERS
        value: "2"

      # --- memory discipline (512 MB) -------------------------------------
      # Measured on this exact image: 5 links -> 366 MB, 20 links -> 413 MB.
      # 25 keeps a safety margin; split bigger lists into several reports.
      - key: MAX_LINKS
        value: "25"
      - key: MAX_UPLOAD_MB
        value: "5"
      - key: JOB_TIMEOUT_MINUTES
        value: "25"

      # --- app logins (set these in the dashboard) ------------------------
      - key: APP_USERS               # alice:pw1,bob:pw2
        sync: false
      - key: SESSION_SECRET
        generateValue: true          # Render generates a strong random value
      - key: COOKIE_SECURE
        value: "1"                   # Render serves HTTPS

      # --- shared X capture account (set these in the dashboard) ----------
      - key: X_USERNAME
        sync: false
      - key: X_PASSWORD
        sync: false
      - key: X_EMAIL
        sync: false
      - key: X_TOTP_SECRET           # only if that account has 2FA on
        sync: false

      # --- durable X session, because Render's disk is ephemeral ----------
      # Without this every cold start signs in to X again, and each sign-in
      # eats into the Browserless monthly allowance.
      - key: X_STATE_STORE
        value: github                # or: none
      - key: X_STATE_GITHUB_REPO     # e.g. yourname/report-secrets (PRIVATE)
        sync: false
      - key: X_STATE_GITHUB_TOKEN    # fine-scoped PAT, contents:read+write
        sync: false
